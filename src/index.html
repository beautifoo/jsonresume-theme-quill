<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Resume</title>
    <link rel="stylesheet" href="./index.css" />
    <!--
      Screen-scheme bootstrap — single source: src/lib/schemeBootstrap.ts.
      Kept byte-equivalent by src/__tests__/indexHtml.test.ts; edit the
      module there, not this copy.
    -->
    <script>
(function () {
	var root = document.documentElement
	var scheme = null
	try {
		scheme = scheme || localStorage.getItem('quill-scheme')
	} catch (e) {
		/* private mode */
	}
	var dark = scheme
		? scheme === 'dark'
		: window.matchMedia('(prefers-color-scheme: dark)').matches
	if (dark) root.classList.add('dark')
	if (!scheme) {
		window
			.matchMedia('(prefers-color-scheme: dark)')
			.addEventListener('change', function (e) {
				root.classList.toggle('dark', e.matches)
			})
	}
})()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./frontend.tsx"></script>
  </body>
</html>
